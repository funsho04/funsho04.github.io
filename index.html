<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saheed Ambali F. | Financial & Data Analyst</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --primary: #0f172a;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text: #334155;
      --muted: #64748b;
      --border: #e2e8f0;
      --tag-bg: #e0f2fe;
      --tag-text: #0369a1;
      --kpi-bg: #f0fdf4;
      --kpi-border: #bbf7d0;
      --kpi-text: #166534;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #1e293b;
      --primary: #f8fafc;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --text: #cbd5e1;
      --muted: #94a3b8;
      --border: #334155;
      --tag-bg: rgba(56, 189, 248, 0.15);
      --tag-text: #38bdf8;
      --kpi-bg: rgba(34, 197, 94, 0.12);
      --kpi-border: rgba(34, 197, 94, 0.3);
      --kpi-text: #4ade80;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.25s, color 0.25s;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Navigation */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background-color 0.25s;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text);
      font-weight: 500;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: var(--accent);
      text-decoration: none;
    }

    .theme-toggle {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 4.5rem 1.5rem;
      text-align: center;
    }

    .hero-inner {
      max-width: 820px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.6rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .hero .subtitle {
      font-size: 1.15rem;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 1.4rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #0284c7;
    }

    .btn-primary:hover {
      background: #0369a1;
      text-decoration: none;
    }

    .btn-cv {
      background: #10b981;
      color: #ffffff;
      border: 1px solid #10b981;
    }

    .btn-cv:hover {
      background: #059669;
      text-decoration: none;
    }

    .btn-outline {
      border: 1px solid #475569;
      color: #ffffff;
      background: transparent;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      text-decoration: none;
    }

    /* Main Container */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem;
    }

    section {
      margin-bottom: 4.5rem;
    }

    h2 {
      font-size: 1.65rem;
      color: var(--primary);
      margin-bottom: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border);
    }

    /* Metrics Strip */
    .metrics-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .metric-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .metric-box strong {
      display: block;
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }

    .metric-box span {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* About Card */
    .about-card {
      background: var(--surface);
      padding: 2rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    .skill-badge {
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
    }

    /* Filter Buttons */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .project-card.hidden {
      display: none;
    }

    .project-card:hover {
      transform: translateY(-3px);
    }

    .project-card h3 {
      color: var(--primary);
      font-size: 1.2rem;
      margin-bottom: 0.65rem;
    }

    .kpi-highlight {
      background: var(--kpi-bg);
      border: 1px solid var(--kpi-border);
      color: var(--kpi-text);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.9rem;
    }

    .project-card p {
      font-size: 0.94rem;
      color: var(--text);
      margin-bottom: 1.25rem;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .project-tags span {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.22rem 0.55rem;
      border-radius: 4px;
    }

    .project-link {
      font-weight: 600;
      font-size: 0.92rem;
    }

    /* Responsive Power BI Embed */
    .iframe-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .iframe-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Contact Box */
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .contact-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
    }

    /* Footer */
    footer {
      background: #0f172a;
      color: #cbd5e1;
      text-align: center;
      padding: 2.25rem 1.5rem;
      font-size: 0.9rem;
    }

    footer a {
      color: #38bdf8;
      margin: 0 0.75rem;
    }

    @media (max-width: 680px) {
      .hero h1 { font-size: 1.95rem; }
      nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="nav-container">
      <div class="logo">Saheed Ambali F.</div>
      <div class="nav-right">
        <nav>
          <a href="#about">About</a>
          <a href="#projects">Projects</a>
          <a href="#dashboards">Power BI</a>
          <a href="#contact">Contact</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">Dark Mode</button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-inner">
      <h1>Saheed Ambali F.</h1>
